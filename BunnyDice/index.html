<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elemental Dice Crawler</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #f8fafc;
            user-select: none;
            overflow: hidden;
        }
        h1, h2, h3, .btn-font { font-family: 'Fredoka', sans-serif; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-screen { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        
        @keyframes dice-roll {
            0% { transform: rotate(0deg) scale(1); filter: blur(0px); }
            25% { transform: rotate(90deg) scale(1.1); filter: blur(2px); }
            50% { transform: rotate(180deg) scale(0.9); filter: blur(4px); }
            75% { transform: rotate(270deg) scale(1.1); filter: blur(2px); }
            100% { transform: rotate(360deg) scale(1); filter: blur(0px); }
        }
        .dice-rolling { animation: dice-roll 0.2s linear infinite; }
        
        .btn-retro {
            border-bottom-width: 4px;
            transition: all 0.1s;
        }
        .btn-retro:active:not(:disabled) {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }

        .monster-float {
            animation: monster-float 3s ease-in-out infinite;
        }
        @keyframes monster-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .pixel-image {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="text-slate-800 touch-none overscroll-none min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ELEMENTS = ['fire', 'water', 'earth', 'lightning', 'wind', 'ice'];
        const ELEMENT_ICONS = {
            'fire': '🔥', 'water': '💧', 'earth': '🌱',
            'lightning': '⚡', 'wind': '🌪️', 'ice': '❄️'
        };
        const ELEMENT_COLORS = {
            'fire': 'bg-red-500 text-white border-red-700',
            'water': 'bg-blue-500 text-white border-blue-700',
            'earth': 'bg-green-500 text-white border-green-700',
            'lightning': 'bg-yellow-400 text-slate-800 border-yellow-600',
            'wind': 'bg-slate-300 text-slate-800 border-slate-500',
            'ice': 'bg-cyan-300 text-slate-800 border-cyan-500'
        };
        
        const WEAKNESSES = {
            'fire': 'ice',
            'ice': 'wind',
            'wind': 'earth',
            'earth': 'lightning',
            'lightning': 'water',
            'water': 'fire'
        };

        const ENEMY_DATA = [
            {name: "Slime", hp: 15, exp: 10, atk: 2, image: 'assets/slime.png'},
            {name: "Goblin", hp: 30, exp: 15, atk: 5, image: 'assets/goblin.png'},
            {name: "Golem", hp: 60, exp: 30, atk: 10, image: 'assets/golem.png'},
            {name: "Wyvern", hp: 100, exp: 50, atk: 15, image: 'assets/wyvern.png'},
            {name: "Demon", hp: 150, exp: 80, atk: 25, image: 'assets/demon.png'},
            {name: "Dragon", hp: 300, exp: 200, atk: 40, image: 'assets/dragon.png'}
        ];

        const DEFAULT_DICE_CONFIG = Array(5).fill([...ELEMENTS]);

        const AudioSys = {
            ctx: null,
            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playTone: function(freq, type, duration, vol=0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playRoll: function() {
                this.init();
                [200, 300, 400, 500, 600].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'square', 0.1, 0.05), i * 30);
                });
            },
            playLock: function() {
                this.init();
                this.playTone(800, 'sine', 0.1, 0.1);
            },
            playHit: function(modifier) {
                this.init();
                const freq = modifier > 1 ? 400 : modifier < 1 ? 100 : 200;
                this.playTone(freq, 'sawtooth', 0.3, 0.3);
            },
            playEnemyHit: function() {
                this.init();
                this.playTone(100, 'square', 0.4, 0.4);
            },
            playLevelUp: function() {
                this.init();
                [440, 554, 659, 880].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'square', 0.2, 0.1), i * 150);
                });
            },
            playDeath: function() {
                this.init();
                this.playTone(50, 'sawtooth', 1.0, 0.5);
            }
        };

        function App() {
            const [gameState, setGameState] = useState('TITLE'); 
            const [shake, setShake] = useState(false);
            
            // Player Stats
            const [hp, setHp] = useState(50);
            const [maxHp, setMaxHp] = useState(50);
            const [level, setLevel] = useState(1);
            const [exp, setExp] = useState(0);
            const [diceConfig, setDiceConfig] = useState(DEFAULT_DICE_CONFIG);
            
            // Battle Stats
            const [floor, setFloor] = useState(1);
            const [enemy, setEnemy] = useState(null); 
            const [activeDice, setActiveDice] = useState(Array(5).fill({value: 'fire', locked: false}));
            const [reRolls, setReRolls] = useState(2);
            const [phase, setPhase] = useState('ROLLING'); 
            const [isRolling, setIsRolling] = useState(false);
            const [combatText, setCombatText] = useState("A wild enemy appears!");

            // Level Up State
            const [modifyingDice, setModifyingDice] = useState({ state: false, diceIdx: null, faceIdx: null });

            const triggerShake = () => {
                setShake(true);
                setTimeout(() => setShake(false), 400);
            };

            const getExpNeeded = (lv) => lv * 20;

            const getAffinity = (element) => {
                if (!element || element === 'rainbow') return 1.0;
                let count = 0;
                diceConfig.forEach(dieFaces => {
                    count += dieFaces.filter(f => f === element).length;
                });
                return count / 5; // e.g., 5 faces total = 1.0x
            };

            const evaluateCombo = (diceValues) => {
                const counts = {};
                diceValues.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
                const freqs = Object.values(counts).sort((a,b) => b - a);
                const uniqueElements = Object.keys(counts).length;

                let primaryElement = null;
                Object.keys(counts).forEach(k => {
                    if (counts[k] === freqs[0]) primaryElement = k;
                });

                if (freqs[0] === 5) return { name: "Divine Annihilation", baseDmg: 50, element: primaryElement };
                if (freqs[0] === 4) return { name: "Nova Explosion", baseDmg: 30, element: primaryElement };
                if (freqs[0] === 3 && freqs[1] === 2) return { name: "Cataclysm (Full House)", baseDmg: 20, element: primaryElement };
                if (uniqueElements === 5) return { name: "Rainbow Beam (Straight)", baseDmg: 15, element: 'rainbow' };
                if (freqs[0] === 3) return { name: "Elemental Surge", baseDmg: 12, element: primaryElement };
                if (freqs[0] === 2 && freqs[1] === 2) return { name: "Dual Convergence", baseDmg: 8, element: primaryElement };
                if (freqs[0] === 2) return { name: "Elemental Blast", baseDmg: 5, element: primaryElement };
                return { name: "Basic Strike", baseDmg: 2, element: primaryElement };
            };

            const getModifierText = (enemyEl, attackEl) => {
                if (attackEl === 'rainbow') return { text: "Typeless!", mult: 1.0 };
                if (WEAKNESSES[attackEl] === enemyEl) return { text: "Super Effective!", mult: 2.0 };
                if (WEAKNESSES[enemyEl] === attackEl) return { text: "Resisted...", mult: 0.5 };
                return { text: "Normal Hit", mult: 1.0 };
            };

            const startNewGame = () => {
                setHp(50); setMaxHp(50); setLevel(1); setExp(0);
                setDiceConfig(DEFAULT_DICE_CONFIG);
                setFloor(1);
                spawnEnemy(1);
                setGameState('BATTLE');
                AudioSys.playLevelUp();
            };

            const spawnEnemy = (floorNum) => {
                const templateIndex = Math.min(Math.floor((floorNum - 1) / 2), ENEMY_DATA.length - 1);
                const template = ENEMY_DATA[templateIndex];
                const modifier = 1 + (floorNum * 0.2);
                const randomElement = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
                
                setEnemy({
                    name: template.name,
                    hp: Math.floor(template.hp * modifier),
                    maxHp: Math.floor(template.hp * modifier),
                    element: randomElement,
                    exp: Math.floor(template.exp * modifier),
                    atk: Math.floor(template.atk * modifier),
                    image: template.image
                });
                
                setReRolls(2);
                setActiveDice(Array(5).fill({value: 'fire', locked: false}));
                setPhase('ROLLING');
                setCombatText(`Floor ${floorNum}: A ${randomElement} ${template.name} appears!`);
                setTimeout(() => forceRoll(true), 100);
            };

            const forceRoll = (all = false) => {
                AudioSys.playRoll();
                setIsRolling(true);
                
                // Rapidly cycle visuals
                const rollInterval = setInterval(() => {
                    setActiveDice(prev => prev.map((die, i) => {
                        if (!all && die.locked) return die;
                        const randomFace = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
                        return { ...die, value: randomFace };
                    }));
                }, 50);

                setTimeout(() => {
                    clearInterval(rollInterval);
                    setIsRolling(false);
                    setActiveDice(prev => prev.map((die, i) => {
                        if (!all && die.locked) return die;
                        const faces = diceConfig[i];
                        return { value: faces[Math.floor(Math.random() * faces.length)], locked: false };
                    }));
                }, 600);
            };

            const rollUnlockedDice = () => {
                if (phase !== 'ROLLING' || reRolls <= 0 || isRolling) return;
                forceRoll(false);
                setReRolls(r => r - 1);
            };

            const toggleLock = (index) => {
                if (phase !== 'ROLLING' || isRolling) return;
                AudioSys.playLock();
                setActiveDice(prev => {
                    const next = [...prev];
                    next[index] = { ...next[index], locked: !next[index].locked };
                    return next;
                });
            };

            const castCombo = () => {
                if (phase !== 'ROLLING' || isRolling) return;
                setPhase('EVALUATING');
                
                const vals = activeDice.map(d => d.value);
                const combo = evaluateCombo(vals);
                const affinity = getAffinity(combo.element);
                const mod = getModifierText(enemy.element, combo.element);
                
                const finalDamage = Math.floor(combo.baseDmg * affinity * mod.mult);
                
                setCombatText(`Cast ${combo.name}! (${combo.element}) - ${mod.text}. Dealt ${finalDamage} DMG!`);
                AudioSys.playHit(mod.mult);
                triggerShake();

                setEnemy(prev => {
                    const newHp = Math.max(0, prev.hp - finalDamage);
                    return { ...prev, hp: newHp };
                });

                setTimeout(() => {
                    setEnemy(prev => {
                        if (prev.hp <= 0) {
                            handleEnemyDeath(prev);
                            return prev;
                        } else {
                            handleEnemyTurn(prev);
                            return prev;
                        }
                    });
                }, 2000);
            };

            const handleEnemyDeath = (defeatedEnemy) => {
                AudioSys.playLevelUp();
                const newExp = exp + defeatedEnemy.exp;
                const needed = getExpNeeded(level);
                
                if (newExp >= needed) {
                    setExp(newExp - needed);
                    setLevel(l => l + 1);
                    setMaxHp(m => m + 10);
                    setGameState('LEVEL_UP');
                    setCombatText(`Defeated ${defeatedEnemy.name}! LEVEL UP to ${level + 1}!`);
                } else {
                    setExp(newExp);
                    setFloor(f => f + 1);
                    setCombatText(`Defeated ${defeatedEnemy.name}! Entering Floor ${floor + 1}...`);
                    setTimeout(() => spawnEnemy(floor + 1), 1500);
                }
            };

            const handleEnemyTurn = (currentEnemy) => {
                setPhase('ENEMY_TURN');
                setCombatText(`Enemy ${currentEnemy.name} attacks for ${currentEnemy.atk} DMG!`);
                AudioSys.playEnemyHit();
                triggerShake();
                
                setHp(prev => {
                    const newHp = Math.max(0, prev - currentEnemy.atk);
                    if (newHp <= 0) {
                        setTimeout(() => {
                            AudioSys.playDeath();
                            setGameState('GAME_OVER');
                        }, 1000);
                    } else {
                        setTimeout(() => {
                            setReRolls(2);
                            setActiveDice(activeDice.map(d => ({...d, locked: false})));
                            setPhase('ROLLING');
                            setCombatText(`Your turn! Roll the dice!`);
                            forceRoll(true);
                        }, 1500);
                    }
                    return newHp;
                });
            };

            // LEVEL UP REWARDS
            const chooseHeal = () => {
                setHp(maxHp);
                AudioSys.playLevelUp();
                finishLevelUp();
            };

            const startEmbody = () => {
                setModifyingDice({ state: true, diceIdx: null, faceIdx: null });
            };

            const selectDiceToModify = (index) => {
                setModifyingDice(prev => ({ ...prev, diceIdx: index }));
            };

            const selectFaceToModify = (index) => {
                setModifyingDice(prev => ({ ...prev, faceIdx: index }));
            };

            const confirmFaceChange = (element) => {
                const newConfig = [...diceConfig];
                newConfig[modifyingDice.diceIdx][modifyingDice.faceIdx] = element;
                setDiceConfig(newConfig);
                AudioSys.playLevelUp();
                setModifyingDice({ state: false, diceIdx: null, faceIdx: null });
                finishLevelUp();
            };

            const finishLevelUp = () => {
                setFloor(f => f + 1);
                setGameState('BATTLE');
                setTimeout(() => spawnEnemy(floor + 1), 500);
            };

            // RENDERERS
            if (gameState === 'TITLE') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-slate-800 text-white">
                        <div className="text-8xl mb-6 flex animate-bounce">
                            <span>🔥</span><span>💧</span><span>⚡</span>
                        </div>
                        <h1 className="text-5xl font-bold mb-4 text-center">BunnyDice</h1>
                        <p className="text-xl text-slate-400 mb-12 text-center max-w-md">
                            A roguelike dice crawler. Construct elemental dice and unleash poker-style combos.
                        </p>
                        <button onClick={startNewGame} className="px-10 py-4 bg-orange-500 hover:bg-orange-600 rounded-2xl text-2xl font-bold btn-font btn-retro shadow-lg min-w-[300px] border-orange-700">
                            START ADVENTURE
                        </button>
                    </div>
                );
            }

            if (gameState === 'GAME_OVER') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-red-900 text-white">
                        <div className="text-8xl mb-6">💀</div>
                        <h1 className="text-5xl font-bold mb-4 text-center btn-font">GAME OVER</h1>
                        <p className="text-xl text-red-300 mb-12 text-center font-bold">
                            You reached Floor {floor} and Level {level}.
                        </p>
                        <button onClick={() => setGameState('TITLE')} className="px-10 py-4 bg-slate-800 hover:bg-slate-700 rounded-2xl text-2xl font-bold btn-font btn-retro shadow-lg border-slate-900">
                            MAIN MENU
                        </button>
                    </div>
                );
            }

            if (gameState === 'LEVEL_UP') {
                if (modifyingDice.state) {
                    return (
                        <div className="h-screen flex flex-col items-center p-6 bg-purple-900 text-white">
                            <h2 className="text-3xl font-bold mb-8 btn-font text-purple-200">Embody an Element</h2>
                            
                            {modifyingDice.diceIdx === null && (
                                <div className="text-center">
                                    <p className="mb-6 font-bold text-lg">Step 1: Choose a Die to Modify</p>
                                    <div className="flex flex-wrap justify-center gap-4">
                                        {diceConfig.map((faces, i) => (
                                            <button key={i} onClick={() => selectDiceToModify(i)} className="p-4 bg-slate-800 rounded-xl hover:bg-slate-700 border-2 border-slate-600">
                                                <div className="text-sm text-slate-400 mb-2 font-bold">Die {i+1}</div>
                                                <div className="grid grid-cols-3 gap-1">
                                                    {faces.map((f, j) => <div key={j} className={`w-6 h-6 flex items-center justify-center text-xs rounded ${ELEMENT_COLORS[f]}`}>{ELEMENT_ICONS[f]}</div>)}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {modifyingDice.diceIdx !== null && modifyingDice.faceIdx === null && (
                                <div className="text-center">
                                    <p className="mb-6 font-bold text-lg">Step 2: Choose a Face to Replace</p>
                                    <div className="grid grid-cols-3 gap-4 max-w-sm mx-auto">
                                        {diceConfig[modifyingDice.diceIdx].map((f, i) => (
                                            <button key={i} onClick={() => selectFaceToModify(i)} className={`w-20 h-20 text-3xl flex items-center justify-center rounded-xl btn-retro ${ELEMENT_COLORS[f]}`}>
                                                {ELEMENT_ICONS[f]}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {modifyingDice.faceIdx !== null && (
                                <div className="text-center w-full max-w-md">
                                    <p className="mb-6 font-bold text-lg">Step 3: Select New Element</p>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                        {ELEMENTS.map(el => (
                                            <button key={el} onClick={() => confirmFaceChange(el)} className={`py-4 text-2xl flex items-center justify-center gap-2 rounded-xl btn-retro ${ELEMENT_COLORS[el]}`}>
                                                {ELEMENT_ICONS[el]} <span className="text-sm font-bold uppercase">{el}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                }

                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-purple-900 text-white">
                        <div className="text-6xl mb-6">🌟</div>
                        <h1 className="text-5xl font-bold mb-4 text-center btn-font text-yellow-400">LEVEL UP!</h1>
                        <p className="text-xl text-purple-200 mb-12 text-center font-bold">
                            You reached Level {level}! Max HP increased to {maxHp}.<br/>Choose your reward:
                        </p>
                        <div className="flex flex-col sm:flex-row gap-6 w-full max-w-xl">
                            <button onClick={chooseHeal} className="flex-1 px-6 py-8 bg-green-500 hover:bg-green-600 rounded-3xl btn-retro shadow-lg border-green-700 flex flex-col items-center">
                                <span className="text-4xl mb-4">💖</span>
                                <span className="text-2xl font-bold btn-font">Heal to Max</span>
                                <span className="text-green-100 text-sm mt-2">Restore {maxHp - hp} HP</span>
                            </button>
                            <button onClick={startEmbody} className="flex-1 px-6 py-8 bg-blue-500 hover:bg-blue-600 rounded-3xl btn-retro shadow-lg border-blue-700 flex flex-col items-center">
                                <span className="text-4xl mb-4">🎲</span>
                                <span className="text-2xl font-bold btn-font">Embody Element</span>
                                <span className="text-blue-100 text-sm mt-2">Change 1 face on a die</span>
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`h-screen flex flex-col bg-slate-100 ${shake ? 'shake-screen' : ''}`}>
                    <header className="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0">
                        <div className="font-bold btn-font text-xl text-orange-400">BunnyDice</div>
                        <div className="flex gap-4 items-center">
                            <div className="text-sm font-bold bg-slate-700 px-3 py-1 rounded text-slate-300">Floor {floor}</div>
                            <div className="xs:inline-block hidden text-xs font-bold bg-slate-700 px-3 py-1 rounded text-slate-300 items-center gap-2">
                                <span>Lv {level}</span>
                                <div className="w-16 h-2 bg-slate-900 rounded-full overflow-hidden inline-block ml-2 align-middle">
                                     <div className="h-full bg-yellow-400" style={{width: `${(exp / getExpNeeded(level))*100}%`}}></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col relative overflow-hidden">
                        
                        {/* ENEMY AREA */}
                        <div className="flex-1 flex flex-col items-center justify-center bg-slate-200 border-b-4 border-slate-300 p-6 relative">
                            {enemy && (
                                <div className={`text-center flex flex-col items-center ${enemy.hp <= 0 ? 'opacity-0 scale-50 transition-all duration-500' : ''}`}>
                                    <div className="relative mb-4">
                                        <div className="absolute -top-6 left-1/2 -translate-x-1/2 text-4xl filter blur-sm opacity-50">{ELEMENT_ICONS[enemy.element]}</div>
                                        <img src={enemy.image} className="w-32 h-32 sm:w-48 sm:h-48 pixel-image monster-float drop-shadow-2xl" alt={enemy.name} />
                                    </div>
                                    <h2 className="text-2xl font-bold text-slate-800 btn-font">{enemy.name}</h2>
                                    <div className="text-xs font-bold text-slate-500 uppercase tracking-widest bg-white/50 px-2 py-1 rounded-full inline-block mt-1">
                                        Type: {enemy.element} (Weak to {WEAKNESSES[enemy.element]})
                                    </div>
                                    
                                    <div className="w-64 h-4 bg-slate-300 rounded-full mt-4 overflow-hidden border-2 border-slate-400">
                                        <div className="h-full bg-red-500 transition-all duration-300" style={{width: `${(enemy.hp / enemy.maxHp) * 100}%`}}></div>
                                    </div>
                                    <div className="text-sm font-bold text-slate-600 mt-1">{enemy.hp} / {enemy.maxHp} HP</div>
                                </div>
                            )}
                            
                            <div className="absolute bottom-4 bg-white/90 px-4 py-3 rounded-xl font-bold text-slate-700 shadow-lg border border-slate-300 backdrop-blur-sm max-w-[90%] text-center min-h-[50px] flex items-center justify-center">
                                {combatText}
                            </div>
                        </div>

                        {/* PLAYER UI */}
                        <div className="bg-white p-4 sm:p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] relative z-20 flex flex-col items-center shrink-0 pb-8">
                            
                            <div className="w-full max-w-md mb-6 flex items-center gap-4">
                                <div className="font-bold text-slate-700">HP</div>
                                <div className="flex-1 h-5 bg-slate-200 rounded-full overflow-hidden border border-slate-300">
                                    <div className="h-full bg-green-500 transition-all duration-300" style={{width: `${(hp / maxHp) * 100}%`}}></div>
                                </div>
                                <div className="font-bold text-slate-700 text-sm whitespace-nowrap">{hp} / {maxHp}</div>
                            </div>

                            <div className="flex gap-2 sm:gap-3 mb-6">
                                {activeDice.map((die, i) => (
                                    <div key={i} onClick={() => toggleLock(i)}
                                         className={`w-14 h-14 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center text-3xl sm:text-4xl shadow-md cursor-pointer transition-transform transform ${ELEMENT_COLORS[die.value]} ${die.locked ? 'ring-4 ring-yellow-400 scale-95 opacity-80' : 'hover:scale-105 active:scale-95'} ${ (!die.locked && isRolling) ? 'dice-rolling' : ''} border-b-4 filter drop-shadow-sm relative`}>
                                        {ELEMENT_ICONS[die.value]}
                                        {die.locked && <div className="absolute -top-2 -right-2 bg-yellow-400 text-[10px] px-1 rounded font-bold text-slate-800">LOCKED</div>}
                                    </div>
                                ))}
                            </div>

                            <div className="flex gap-4 w-full max-w-md">
                                <button disabled={phase !== 'ROLLING' || reRolls <= 0 || isRolling} onClick={rollUnlockedDice}
                                    className="flex-1 py-4 bg-blue-500 hover:bg-blue-600 disabled:bg-blue-300 disabled:opacity-50 text-white font-bold rounded-xl btn-retro btn-font text-lg shadow-lg border-blue-700">
                                    ROLL ({reRolls})
                                </button>
                                <button disabled={phase !== 'ROLLING' || isRolling} onClick={castCombo}
                                    className="flex-1 py-4 bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 disabled:opacity-50 text-white font-bold rounded-xl btn-retro btn-font text-lg shadow-lg border-orange-700">
                                    CAST
                                </button>
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
